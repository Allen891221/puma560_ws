# =====================================================================
# 關節範圍（單位：度）
#
# default：教學用，全部 −180° ～ 180°（預設）
# real   ：PUMA560「實際」關節範圍 —— ⚠ 僅供參考 ⚠
#          這組數值是教材與 Robotics Toolbox 等處常見的引用值，
#          本專案沒有對照 Unimation 原廠手冊查證；
#          而且不同書的關節零點定義可能和 Craig 的 DH 座標系不同，
#          所以這組數值不一定能直接套用在 Craig 的 θ 上。
#          若講義或課本有提供數值，請以講義為準，修改此處即可。
# =====================================================================
default:
  joint_1: [-180.0, 180.0]
  joint_2: [-180.0, 180.0]
  joint_3: [-180.0, 180.0]
  joint_4: [-180.0, 180.0]
  joint_5: [-180.0, 180.0]
  joint_6: [-180.0, 180.0]

real:
  joint_1: [-160.0, 160.0]
  joint_2: [-225.0,  45.0]
  joint_3: [ -45.0, 225.0]
  joint_4: [-110.0, 170.0]
  joint_5: [-100.0, 100.0]
  joint_6: [-266.0, 266.0]
